<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request a Coverage Review | Insure With Yuki</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3ed;
      color: #071a33;
      line-height: 1.6;
    }

    .container {
      max-width: 760px;
      margin: 40px auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      color: #071a33;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #444;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 18px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 110px;
    }

    .checkbox {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 20px;
      font-size: 14px;
    }

    .checkbox input {
      width: auto;
      margin-top: 5px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      background: #071a33;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #12345a;
    }

    .small-text {
      font-size: 12px;
      color: #555;
      margin-top: 18px;
      text-align: center;
    }

    .links {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
    }

    a {
      color: #071a33;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Request a Coverage Review</h1>

    <p>
      Complete this form to request an insurance coverage review.
      After submitting, you may schedule directly on my calendar.
    </p>

    <form action="https://calendly.com/ykobayashi-farmers" method="get" target="_blank">

      <label for="full-name">Full Name</label>
      <input type="text" id="full-name" name="full-name" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" required />

      <label for="coverage-type">What would you like reviewed?</label>
      <select id="coverage-type" name="coverage-type" required>
        <option value="">Select one</option>
        <option value="home">Home Insurance</option>
        <option value="condo">Condo Insurance</option>
        <option value="auto">Auto Insurance</option>
        <option value="umbrella">Umbrella Insurance</option>
        <option value="business">Business / Commercial Insurance</option>
        <option value="multiple">Multiple Policies</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell me what you would like reviewed."></textarea>

      <div class="checkbox">
        <input type="checkbox" id="sms-consent" name="sms-consent" />
        <label for="sms-consent">
By checking this box, I consent to receive SMS from Insure With Yuki. Reply STOP to opt-out; Reply HELP for support; Message & data rates may apply; Messaging frequency may vary. Visit https://insurewithyuki.com/privacy.html to see our privacy policy and https://insurewithyuki.com/terms-and-conditions.html for our Terms of Service.
      <button type="submit">Submit Request & Schedule Review</button>
    </form>

    <p class="small-text">
      Mobile opt-in information is not shared or sold to third parties for marketing or promotional purposes.
    </p>

    <div class="links">
      <a href="https://insurewithyuki.com/privacy.html">Privacy Policy</a>
      |
      <a href="https://insurewithyuki.com/terms-and-conditions.html">Terms & Conditions</a>
      |
      <a href="https://insurewithyuki.com">Back to Home</a>
    </div>
  </div>

</body>
</html>
